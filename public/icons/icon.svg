  <rect x="96" y="176" width="320" height="224" rx="24" fill="#d97706"/>
  <!-- Camera top bump -->
  <rect x="176" y="144" width="100" height="48" rx="12" fill="#d97706"/>
  <!-- Lens outer ring -->
